name: Update shark incident data

on:
  schedule:
    # Every Monday at 14:00 UTC (~4am HST). DLNR adds incidents after
    # completing its own investigation, so incidents appear irregularly —
    # weekly is frequent enough without hammering their server.
    - cron: "0 14 * * 1"
  workflow_dispatch: {}   # lets you trigger a refresh manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch + rebuild incident data
        run: python scripts/fetch_data.py

      - name: Commit updated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No data changes."
          else
            git add data/
            git commit -m "Auto-update shark incident data [skip ci]"
            git push
          fi
